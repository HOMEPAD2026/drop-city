<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DROP CITY</title>
<meta name="description" content="The city's agent drops a coin every hour; anyone launches their own any time. On pump.fun, fees split on chain, the city vault buys back the hottest.">
<meta name="theme-color" content="#070708">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pad.css?v=m4">
<link rel="stylesheet" href="/roam.css?v=9">
<link rel="modulepreload" href="/roam.js?v=1"><link rel="preload" href="/models/real/anims.glb" as="fetch" crossorigin>
<link rel="stylesheet" href="/intro.css?v=2"><script>try{if(sessionStorage.getItem("dc.intro")&&!/[?&]intro=1\b/.test(location.search))document.documentElement.classList.add("nointro")}catch(e){}setTimeout(function(){var i=document.getElementById("intro");if(i&&!i.dataset.on){i.remove();document.documentElement.style.overflow="";window.__introDone=1;dispatchEvent(new Event("intro:done"))}},7000)</script>
</head>
<body>
<div id="intro"></div>
<canvas id="city" aria-label="The city"></canvas>
<header class="top">
  <a class="brand" href="/" style="text-decoration:none;color:inherit"><b data-name>DROP CITY</b><small>← the website · the launchpad you can play</small></a>
  <div class="clock" id="clock"><span class="lbl">HOUR</span><b id="clk-h">--:00</b><span id="clk-s" class="st">…</span></div>
  <div class="acts"><button type="button" class="btn ghost" id="wallet">Connect</button><button type="button" class="btn hot" id="drop">LAUNCH A COIN</button></div>
</header>
<aside class="phone" id="phone">
  <div class="ph-bar"><span id="ph-time">--:--</span><span class="ph-sig">▮▮▮▯ PUMP FM</span></div>
  <nav class="ph-tabs" role="tablist">
    <button type="button" data-t="wanted" class="on">MOST WANTED</button><button type="button" data-t="today">TODAY</button><button type="button" data-t="vault">THE VAULT</button><button type="button" data-t="rules">RULES</button>
  </nav>
  <div class="ph-body" id="ph-body"></div>
</aside>
<div class="hud" id="hud">
  <button type="button" class="me-chip" id="me-chip" title="Your street name"><i class="av"></i><span><b id="me-name">…</b><small id="me-look"></small></span></button>
  <span class="here" title="Players in the streets now"><i></i><b id="here-n">1</b></span>
  <div class="wl" id="wl" title="Wanted level"></div>
  <div class="cash" id="cash" title="Street cash — a score for fun, nothing on chain">$0</div>
  <div class="hpb" title="Health"><i id="hp"></i></div>
  <button type="button" class="snd" id="snd" title="Sound">♪</button>
</div>
<div class="modes" id="modes"><button type="button" id="m-street" class="on">STREET</button><button type="button" id="m-map">MAP</button><button type="button" id="m-phone">PHONE</button><button type="button" id="m-music" class="mus" aria-label="Music">♫</button></div>
<div class="pad" id="pad"><div class="stick" id="stick"><i></i></div><button type="button" id="b-emote" aria-label="Wave">👋</button><button type="button" id="b-jump" aria-label="Jump">JUMP</button><button type="button" id="b-hit" aria-label="Punch">PUNCH</button></div>
<button type="button" class="act" id="act" hidden></button>
<div class="keys" id="keys"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · <b>F</b> punch · <b>E</b> act · <b>1</b> <b>2</b> emote · drag to look</div>
<div class="jobs" id="jobs"></div>
<div class="turf" id="turf" hidden></div>
<canvas class="mmap" id="mmap" aria-label="Map"></canvas>
<div class="wp" id="wp" hidden><i></i><b></b></div>
<div class="fx" id="fx"></div>
<div class="loadst" id="loadst">SUITING UP…</div>
<section class="card" id="card" hidden></section>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="takeover" id="takeover" hidden></div>
<script src="/solwallet.js" defer></script>
<script type="module" src="/app.js"></script>
<script type="module" async src="/intro.js?v=2"></script>
</body>
</html>
