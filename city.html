<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DROP CITY</title>
<meta name="description" content="The city's agent drops a coin every hour; anyone launches their own any time. On pump.fun, fees split on chain, the city vault buys back the hottest.">
<meta name="theme-color" content="#070708">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pad.css?v=m2">
<link rel="stylesheet" href="/intro.css?v=1"><script>try{if(sessionStorage.getItem("dc.intro")&&!/[?&]intro=1\b/.test(location.search))document.documentElement.classList.add("nointro")}catch(e){}setTimeout(function(){var i=document.getElementById("intro");if(i&&!i.dataset.on)i.remove(),document.documentElement.style.overflow=""},7000)</script>
</head>
<body>
<div id="intro"></div>
<canvas id="city" aria-label="The city"></canvas>
<header class="top">
  <a class="brand" href="/" style="text-decoration:none;color:inherit"><b data-name>DROP CITY</b><small>← the website · a drop every hour</small></a>
  <div class="clock" id="clock"><span class="lbl">HOUR</span><b id="clk-h">--:00</b><span id="clk-s" class="st">…</span></div>
  <div class="acts"><button type="button" class="btn ghost" id="wallet">Connect</button><button type="button" class="btn hot" id="drop">LAUNCH A COIN</button></div>
</header>
<aside class="phone" id="phone">
  <div class="ph-bar"><span id="ph-time">--:--</span><span class="ph-sig">▮▮▮▯ PUMP FM</span></div>
  <nav class="ph-tabs" role="tablist">
    <button type="button" data-t="wanted" class="on">MOST WANTED</button><button type="button" data-t="today">TODAY</button><button type="button" data-t="vault">THE VAULT</button><button type="button" data-t="rules">RULES</button>
  </nav>
  <div class="ph-body" id="ph-body"></div>
</aside>
<section class="card" id="card" hidden></section>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="takeover" id="takeover" hidden></div>
<script src="/solwallet.js" defer></script>
<script type="module" src="/app.js"></script>
<script type="module" async src="/intro.js?v=1"></script>
</body>
</html>
